name: Continuous Delivery
on:
  push:
    branches: ["main"]

env:
  ACR_NAME: regd1
  LOGIN_SERVER: regd1.azurecr.io
  IMAGE_NAME: simple-flask-app

jobs:
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.build-image.outputs.image }}
    steps:
      - name: Check out code
        uses: actions/checkout@v3

      # 1. Log into your existing Azure Container Registry
      - name: Log in to Azure Container Registry
        uses: azure/docker-login@v2
        with:
          login-server: ${{ env.LOGIN_SERVER }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      # 2. Build and push directly to your login server
      - name: Build, tag, and push image to Azure Container Registry
        id: build-image
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t ${{ env.LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:$IMAGE_TAG .
          docker push ${{ env.LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:$IMAGE_TAG
          echo "image=${{ env.LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:$IMAGE_TAG" >> $GITHUB_OUTPUT

  deploy:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Check out code
        uses: actions/checkout@v3

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v2

      # 3. Log into Azure instead of AWS for Terraform to apply changes
      - name: Log in to Azure CLI
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Terraform Init
        run: terraform -chdir=terraform init

      - name: Terraform Apply
        run: terraform -chdir=terraform apply -auto-approve -var="image_tag=${{ github.sha }}"
